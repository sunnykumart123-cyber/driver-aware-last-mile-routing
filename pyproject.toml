[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-driver-reliability"
version = "0.1.0"
description = "Learned driver behaviour with distributionally-robust service-level guarantees for last-mile routing"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:lightgbm.*",
]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
